name: symptom_tracker_app
description: A portable pain event recorder companion app for ESP32 device.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE communication with ESP32
  flutter_blue_plus: ^1.35.5

  # Charts: pressure curve + stats
  fl_chart: ^0.70.2

  # Local storage (no code generation needed)
  hive_flutter: ^1.1.0

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Notifications (post-event alerts)
  flutter_local_notifications: ^18.0.1

  # GPS location (SOS stub)
  geolocator: ^13.0.4

  # Audio recording (stub)
  record: ^5.2.0

  # Runtime permissions
  permission_handler: ^11.4.0

  # Unique ID generation
  uuid: ^4.5.1

  # Date/time formatting
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
